version: 2

project_name: yolocam

before:
  hooks:
    - go mod tidy
    - make licenses

builds:
  - id: yolocam
    main: ./cmd/yolocam
    binary: yolocam
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/bemoty/yolocam/cmd/yolocam/internal/cli.version={{.Version}}
      - -X github.com/bemoty/yolocam/cmd/yolocam/internal/cli.commit={{.ShortCommit}}
      - -X github.com/bemoty/yolocam/cmd/yolocam/internal/cli.date={{.Date}}

archives:
  - id: unix
    ids: [yolocam]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - third_party_licenses/**/*

checksum:
  name_template: checksums.txt

release:
  draft: true
